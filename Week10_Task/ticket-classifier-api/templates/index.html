<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Ticket Classifier</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>Support Ticket Classifier</h1>
    <p class="subtitle">Enter a support ticket description to predict its category</p>
 
    <textarea id="ticketText" placeholder="e.g. cannot login to system"></textarea>
    <button id="predictBtn">Predict Category</button>
 
    <div id="result" class="result hidden">
      <p class="result-label">Predicted Category</p>
      <h2 id="category"></h2>
      <p id="confidence"></p>
    </div>
</div>
 
  <script>
    const btn = document.getElementById("predictBtn");
    const resultBox = document.getElementById("result");
 
    btn.addEventListener("click", async () => {
      const text = document.getElementById("ticketText").value;
      if (!text.trim()) {
        alert("Please enter ticket text");
        return;
      }
 
      btn.textContent = "Predicting...";
      btn.disabled = true;
 
      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
 
        if (!response.ok) throw new Error("Request failed");
        const data = await response.json();
 
        document.getElementById("category").textContent = data.category;
        document.getElementById("confidence").textContent =
          "Confidence: " + (data.confidence * 100).toFixed(1) + "%";
        resultBox.classList.remove("hidden");
      } catch (err) {
        alert("Something went wrong. Please try again.");
      } finally {
        btn.textContent = "Predict Category";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
